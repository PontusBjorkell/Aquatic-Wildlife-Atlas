[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aquatic-wildlife-atlas"
version = "0.1.0"
description = "End-to-end analytics project for aquatic wildlife records"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Pontus Björkell" }
]
dependencies = [
    "pandas>=2.2,<3.0",
    "numpy>=1.26,<3.0",
    "scipy>=1.13,<2.0",
    "statsmodels>=0.14,<1.0",
    "scikit-learn>=1.5,<2.0",
    "plotly>=5.24,<7.0",
    "altair>=5.4,<6.0",
    "streamlit>=1.39,<2.0",
    "sqlalchemy>=2.0,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"